[program:apiserver]
priority=10
command=/app/pkg/apiserver.sh
user=cloudron
environment=HOME="/run/dependency-track",DT_INIT_TASKS_ENABLED="false"
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
